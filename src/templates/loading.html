<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토지 분석 진행 중...</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>AI가 토지 데이터를 분석하고 있습니다...</p>
        <p>Task ID: {{ task_id }}</p>
    </div>

    <script>
        const taskId = "{{ task_id }}";
        
        async function checkStatus() {
            try {
                const response = await fetch(`/api/status/${taskId}`);
                const data = await response.json();
                
                if (data.error) {
                    const container = document.querySelector('.loading-state');
                    container.innerHTML = `
                        <div class="error-state">
                            <h2>분석 중 오류가 발생했습니다</h2>
                            <p>${data.error}</p>
                            <a href="/" class="btn">다시 시도</a>
                        </div>
                    `;
                    return;
                }
                
                if (data.status === 'completed') {
                    window.location.href = `/result/${taskId}`;
                } else if (data.status === 'error') {
                    const container = document.querySelector('.loading-state');
                    container.innerHTML = `
                        <div class="error-state">
                            <h2>분석 중 오류가 발생했습니다</h2>
                            <p>${data.error || '알 수 없는 오류가 발생했습니다.'}</p>
                            <a href="/" class="btn">다시 시도</a>
                        </div>
                    `;
                } else {
                    // If the task is still in progress, update the UI with the progress
                    if(data.progress && data.message) {
                        // You can add a progress message element to your HTML
                        // For now, let's just log it.
                        console.log(`Progress: ${data.progress}% - ${data.message}`);
                    }
                    setTimeout(checkStatus, 2000);
                }
            } catch (error) {
                console.error('상태 확인 오류:', error);
                const container = document.querySelector('.loading-state');
                container.innerHTML = `
                    <div class="error-state">
                        <h2>네트워크 오류</h2>
                        <p>상태를 확인하는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</p>
                        <a href="/" class="btn">다시 시도</a>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            checkStatus();
        });
    </script>
</body>
</html>
